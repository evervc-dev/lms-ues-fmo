# nginx del rol web: sirve public/ y pasa PHP a php-fpm (127.0.0.1:9000).
# /app/ (protocolo Pusher) va al servicio reverb, así el navegador usa el mismo dominio.
# Los marcadores __PORT__, __RESOLVER__ y __REVERB_UPSTREAM__ los sustituye docker/entrypoint.sh al arrancar
# (PORT, NGINX_RESOLVER y REVERB_UPSTREAM). Por defecto: Docker Compose. En Railway: PORT lo inyecta la plataforma,
# NGINX_RESOLVER="[fd12::10] valid=30s" y REVERB_UPSTREAM=http://reverb.railway.internal:8080.
server {
    listen __PORT__ default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;
    server_tokens off;

    # DNS interno: reverb puede arrancar después que nginx.
    resolver __RESOLVER__;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Redirección de WebSockets para Laravel Reverb (Conexiones cliente)
    location /app/ {
        set $reverb __REVERB_UPSTREAM__;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Redirección de API interna para Laravel Reverb (Rutas /apps/ de estadísticas/broadcasting)
    location /apps/ {
        set $reverb __REVERB_UPSTREAM__;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
