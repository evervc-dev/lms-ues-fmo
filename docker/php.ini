; PHP del LMS UES en contenedor
expose_php = Off
memory_limit = 256M
max_execution_time = 120
; Límites de subida alineados con el sistema: entregas de hasta 100 MB por archivo (RF15) y carpetas de materiales de
; hasta 50 archivos y 80 MB en total (RF11). Con 64M y el máximo de 20 archivos por petición de PHP, una carpeta
; grande o con más de 20 archivos se rechazaba o perdía archivos (QA 22/11/2026). nginx.conf usa el mismo tope.
upload_max_filesize = 105M
post_max_size = 110M
max_file_uploads = 60
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
