# Servicios de desarrollo del LMS UES. Iguales para Linux y Windows.
# Uso: docker compose -f docker-compose.dev.yml up -d
name: lms-ues-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      TZ: UTC
    ports: ["${DB_FORWARD_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lms
      MINIO_ROOT_PASSWORD: lms-secret-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lms lms-secret-dev; do sleep 2; done;
      mc mb --ignore-existing local/lms-archivos;
      exit 0;"

volumes:
  pgdata:
  redisdata:
  miniodata:
